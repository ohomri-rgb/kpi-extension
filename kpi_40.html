<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>KPI</title>
<style>
@font-face{font-family:'Noto Sans Hebrew';src:url('NotoSansHebrew-Regular.ttf') format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'Noto Sans Hebrew';src:url('NotoSansHebrew-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'Noto Sans Hebrew';src:url('NotoSansHebrew-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal}
</style>
<script src="tableau.extensions.js"></script>
<script src="chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:'Noto Sans Hebrew',sans-serif;background:#fff;overflow:hidden}
#app{padding:3%;height:100%;display:flex;flex-direction:column;opacity:0}
.lbl{font-weight:600;color:#374151}
.val-row{display:flex;align-items:baseline;gap:0.3em;margin:0.2em 0 0.2em;flex-wrap:nowrap}
.val{font-weight:800;color:#111;letter-spacing:-1.5px;line-height:1}
.chg{font-weight:600}
.up{color:#16a34a}.down{color:#dc2626}
.period-cur{color:#6b7280;font-weight:500;margin-bottom:0.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period-cur span.date-val{color:#374151;font-weight:500}
.wrap{flex:1;min-height:0;position:relative}
</style></head><body>
<div id="app">
  <div class="lbl" id="lbl"></div>
  <div class="val-row">
    <div class="val" id="val"></div>
    <div class="chg" id="chg"></div>
  </div>
  <div class="period-cur"><span id="cur-label"></span> <span id="cur"></span></div>
  <div class="period-cur" id="period-cmp-row" style="display:none"><span id="vs-label"></span> <span id="prev"></span></div>
  <div class="wrap" id="wrap"><canvas id="ch"></canvas></div>
  <div style="font-size:10px;color:#d1d5db;text-align:left;direction:ltr;margin-top:2px">v70</div>
<script>
const G=id=>document.getElementById(id);
const fmt=n=>n!=null?n.toLocaleString('en-US',{notation:'compact',maximumFractionDigits:1}):'—';
let ch=null,ws=null,timer=null,firstLoad=true;

const LANG={
  he:{current:'תקופה נוכחית:',vs:'השוואה:',dir:'rtl',lineCur:'נוכחי',linePrv:'שנה קודמת'},
  en:{current:'Current:',vs:'vs:',dir:'ltr',lineCur:'Current',linePrv:'Prior Year'}
};
const MONTHS={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11,jan:0,feb:1,mar:2,apr:3,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

const isHebrew=s=>/[\u0590-\u05FF]/.test(s);
function applyLang(name){
  const L=isHebrew(name)?LANG.he:LANG.en,app=G('app');
  app.style.direction=L.dir;app.style.textAlign=L.dir==='rtl'?'right':'left';
  G('cur-label').textContent=L.current;G('vs-label').textContent=L.vs;
  return L;
}
function setFonts(){
  const b=Math.min(window.innerWidth,window.innerHeight),r=v=>Math.round(b*v)+'px';
  G('lbl').style.fontSize=r(0.07);G('val').style.fontSize=r(0.14);G('chg').style.fontSize=r(0.06);
  document.querySelectorAll('.period-cur').forEach(el=>el.style.fontSize=r(0.05));
}
window.addEventListener('resize',setFonts);

const hexToRgba=(hex,a)=>{
  let c=(hex||'').replace('#','');
  if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return isNaN(r)?`rgba(99,102,241,${a})`:`rgba(${r},${g},${b},${a})`;
};
function parseDate(raw,fv){
  let d=new Date(raw),s,m;
  if(!isNaN(d)&&d.getFullYear()>1990)return d;
  d=new Date(fv);
  if(!isNaN(d)&&d.getFullYear()>1990)return d;
  s=String(fv||raw||'');
  if((m=s.match(/([A-Za-z]+)\s+(\d{4})/))&&MONTHS[m[1].toLowerCase()]!==undefined)return new Date(+m[2],MONTHS[m[1].toLowerCase()],1);
  if(m=s.match(/Q(\d)[\/\s\-]?(\d{4})/i))return new Date(+m[2],(+m[1]-1)*3,1);
  if(m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))return new Date(+m[3],+m[2]-1,+m[1]);
  if(m=s.match(/(\d{4})-(\d{2})-(\d{2})/))return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/\d{4}/);return m?new Date(+m[0],0,1):new Date('invalid');
}
const cleanName=s=>s.replace(/^(sum|avg|count|min|max|attr|median)\s*\(/i,'').replace(/\)$/,'').trim();
const getParam=(params,name)=>{const p=params.find(p=>p.name.toLowerCase()===name.toLowerCase());return p?String(p.currentValue.value||p.currentValue.formattedValue||'').trim():'';};
const normDate=s=>{let t,x=String(s||'').trim();if((t=x.match(/^(\d{4})-(\d{2})-(\d{2})$/)))return t[3]+'.'+t[2]+'.'+t[1];if((t=x.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{4})$/)))return t[1].padStart(2,'0')+'.'+t[2].padStart(2,'0')+'.'+t[3];return x;};
const fmtDMY=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
const sortPts=g=>Object.values(g).filter(p=>!isNaN(p.d)&&p.d.getFullYear()>1990).sort((a,b)=>a.d-b.d);
const mkTip=cb=>({backgroundColor:'#fff',borderColor:'#e5e7eb',borderWidth:1,titleColor:'#374151',bodyColor:'#111',padding:12,boxPadding:5,callbacks:cb});

async function load(){
  G('period-cmp-row').style.display='none';
  if(ch){ch.destroy();ch=null;}
  try{
    const params=await ws.getParametersAsync();
    const frame=getParam(params,'frame');
    const dt=await ws.getSummaryDataAsync({ignoreSelection:true});
    const cols=dt.columns,rows=dt.data;

    let di=cols.findIndex(c=>c.fieldName.toLowerCase()==='truncated');
    if(di<0)di=cols.findIndex(c=>c.dataType.toLowerCase().includes('date'));
    const rangeColIdx=cols.findIndex(c=>c.fieldName.toLowerCase()==='range');

    let mi=-1,maxVal=-Infinity;
    cols.forEach((c,i)=>{
      if(i===rangeColIdx||c.dataType.toLowerCase().includes('date'))return;
      if(!['float','int','real','integer','number'].some(t=>c.dataType.toLowerCase().includes(t)))return;
      let colMax=0;rows.forEach(r=>{colMax=Math.max(colMax,Math.abs(parseFloat(r[i].value)||0));});
      if(colMax>maxVal){maxVal=colMax;mi=i;}
    });
    if(di<0||mi<0)return;

    const measureName=cleanName(cols[mi].fieldName);
    const L=applyLang(measureName);
    let pts,prv,last,lastPrv,curLabel,prevLabel;

    if(frame==='range'&&rangeColIdx>=0){
      const g1={},g2={};
      rows.forEach(r=>{
        const rv=String(r[rangeColIdx].value!=null?r[rangeColIdx].value:r[rangeColIdx].formattedValue||'');
        const key=r[di].formattedValue,d=parseDate(r[di].value,r[di].formattedValue),y=parseFloat(r[mi].value)||0;
        const g=rv==='1'?g1:rv==='2'?g2:null;
        if(g){if(!g[key])g[key]={x:key,y:0,d};g[key].y+=y;}
      });
      pts=sortPts(g1);const pts2=sortPts(g2);
      if(!pts.length){
        G('val').textContent='—';G('chg').textContent='No data for Period 1';G('chg').className='chg';
        G('cur').textContent=normDate(getParam(params,'from1'))+' \u2013 '+normDate(getParam(params,'to1'));
        if(firstLoad){G('app').style.opacity='1';firstLoad=false;}
        setFonts();return;
      }
      prv=pts.map((p,i)=>pts2[i]||{x:null,y:null});
      last=pts[pts.length-1];lastPrv=prv[prv.length-1];
      const f1=normDate(getParam(params,'from1')),t1=normDate(getParam(params,'to1'));
      const f2=normDate(getParam(params,'from2')),t2=normDate(getParam(params,'to2'));
      if(pts.length===1){
        pts=[{x:f1,y:pts[0].y,d:pts[0].d},{x:t1,y:pts[0].y,d:pts[0].d}];
        const p2y=pts2.length?pts2[0].y:null;
        prv=[{x:f2,y:p2y,d:pts2.length?pts2[0].d:null},{x:t2,y:p2y,d:pts2.length?pts2[0].d:null}];
        last={x:f1+' \u2013 '+t1,y:pts[0].y,d:pts[0].d};lastPrv={x:f2+' \u2013 '+t2,y:p2y,d:prv[0].d};
      }
      curLabel=f1+' - '+t1;prevLabel=f2+' - '+t2;
      G('vs-label').textContent=isHebrew(measureName)?'השוואה:':'vs:';G('period-cmp-row').style.display='block';
    } else {
      const grouped={};
      rows.forEach(r=>{
        const key=r[di].formattedValue,d=parseDate(r[di].value,r[di].formattedValue),y=parseFloat(r[mi].value)||0;
        if(!grouped[key])grouped[key]={x:key,y:0,d};grouped[key].y+=y;
      });
      const allPts=Object.values(grouped).filter(p=>!isNaN(p.d)&&p.d.getFullYear()>1990).sort((a,b)=>a.d-b.d);
      if(!allPts.length)return;
      const curYear=allPts[allPts.length-1].d.getFullYear();
      pts=allPts.filter(p=>p.d.getFullYear()===curYear);
      const prvAll=allPts.filter(p=>p.d.getFullYear()===curYear-1);
      if(!pts.length)return;
      const gran=getParam(params,'parameter 1')||getParam(params,'parameter1')||'month';
      function periodNum(d,g){
        const g2=g.toLowerCase();
        if(g2==='month')return d.getMonth();
        if(g2==='quarter')return Math.floor(d.getMonth()/3);
        if(g2==='year')return 0;
        if(g2==='week'){
          const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
          const dayNum=tmp.getUTCDay()||7;tmp.setUTCDate(tmp.getUTCDate()+4-dayNum);
          return Math.ceil((((tmp-new Date(Date.UTC(tmp.getUTCFullYear(),0,1)))/86400000)+1)/7);
        }
        return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
      }
      const prvMap={};prvAll.forEach(p=>{prvMap[periodNum(p.d,gran)]=p;});
      prv=pts.map(p=>prvMap[periodNum(p.d,gran)]||{x:null,y:null});
      last=pts[pts.length-1];lastPrv=prv[prv.length-1]||{x:null,y:null};

      if(gran.toLowerCase()==='year'){
        let rawColIdx=-1,rawMaxTest=new Date(0);
        cols.forEach((c,ci)=>{
          if(ci===di||ci===rangeColIdx||!c.dataType.toLowerCase().includes('date'))return;
          let colMax=new Date(0);rows.forEach(r=>{const d2=parseDate(r[ci].value,r[ci].formattedValue);if(d2>colMax)colMax=d2;});
          if(colMax>rawMaxTest){rawMaxTest=colMax;rawColIdx=ci;}
        });
        if(rawColIdx>=0){
          const gCur={},gPrv={};
          rows.forEach(r=>{
            const d2=parseDate(r[rawColIdx].value,r[rawColIdx].formattedValue),y=parseFloat(r[mi].value)||0;
            if(isNaN(d2))return;
            const yr=d2.getFullYear(),bucket=d2.getMonth()+1,mKey=yr+'-'+String(bucket).padStart(2,'0');
            if(yr===curYear){if(!gCur[bucket])gCur[bucket]={x:mKey,y:0,d:new Date(yr,d2.getMonth(),1)};gCur[bucket].y+=y;}
            else if(yr===curYear-1){if(!gPrv[bucket])gPrv[bucket]={x:mKey,y:0,d:new Date(yr,d2.getMonth(),1)};gPrv[bucket].y+=y;}
          });
          const mCur=Object.values(gCur).sort((a,b)=>a.d-b.d),mPrv=Object.values(gPrv).sort((a,b)=>a.d-b.d);
          if(mCur.length>=2){
            pts=[mCur[0],mCur[mCur.length-1]];
            const prvFirst=mPrv[0]||{x:null,y:null},prvLast=mPrv[mPrv.length-1]||{x:null,y:null};
            prv=[prvFirst,prvLast];
            last={x:String(curYear),y:mCur.reduce((s,p)=>s+p.y,0),d:pts[1].d};
            lastPrv={x:String(curYear-1),y:mPrv.reduce((s,p)=>s+p.y,0),d:prvLast.d||null};prv[1]=lastPrv;
          }
        }
        let maxD=new Date(0);
        rows.forEach(r=>cols.forEach((c,ci)=>{
          if(ci===di||ci===rangeColIdx||!c.dataType.toLowerCase().includes('date'))return;
          const d2=parseDate(r[ci].value,r[ci].formattedValue);if(!isNaN(d2)&&d2>maxD)maxD=d2;
        }));
        const endCur=maxD>new Date(0)?maxD:allPts[allPts.length-1].d;
        const endPrv=new Date(endCur);endPrv.setFullYear(endPrv.getFullYear()-1);
        curLabel='01.01.'+curYear+' \u2013 '+fmtDMY(endCur);prevLabel='01.01.'+(curYear-1)+' \u2013 '+fmtDMY(endPrv);
        if(pts.length===2){
          pts[0].x=curLabel;pts[0].y=last.y;pts[1].x=curLabel;pts[1].y=last.y;
          if(prv[0]){prv[0].x=prevLabel;prv[0].y=lastPrv.y||0;}
          if(prv[1]){prv[1].x=prevLabel;prv[1].y=lastPrv.y||0;}
        }
      } else {
        curLabel=normDate(last.x);prevLabel=normDate(lastPrv.x||'');
      }
      G('vs-label').textContent=L.vs;G('period-cmp-row').style.display='block';
    }

    G('lbl').textContent=measureName;G('val').textContent=fmt(last.y);
    G('cur').textContent=curLabel;G('cur').className='date-val';
    G('prev').textContent=prevLabel;G('prev').className='date-val';

    let color='#6366f1';
    if(lastPrv&&lastPrv.y!=null&&lastPrv.y!==0){
      const diff=last.y-lastPrv.y,pct=Math.abs(diff/Math.abs(lastPrv.y)*100).toFixed(0),up=diff>0,neutral=Math.abs(diff)<0.0001;
      color=neutral?'#6366f1':up?'#16a34a':'#dc2626';
      G('chg').innerHTML='<span style="direction:ltr;unicode-bidi:embed">'+(neutral?'':up?'▲+':'▼-')+fmt(Math.abs(diff))+' ('+(neutral?'':up?'+':'-')+pct+'%)</span>';
      G('chg').className='chg '+(neutral?'':up?'up':'down');
    }else{G('chg').textContent='';}

    const wrap=G('wrap');
    wrap.innerHTML='<canvas id="ch"></canvas>';
    const canvas=G('ch'),h=canvas.parentElement.offsetHeight||200;
    const ctx=canvas.getContext('2d'),grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,hexToRgba(color,0.2));grad.addColorStop(1,hexToRgba(color,0));
    const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}},animation:false};

    if(pts.length===1){
      const prvY=prv[0]&&prv[0].y!=null?prv[0].y:null;
      ch=new Chart(canvas,{type:'bubble',data:{datasets:[
        {label:L.lineCur,data:[{x:0,y:pts[0].y,r:18}],backgroundColor:hexToRgba(color,0.85),borderColor:color,borderWidth:2},
        prvY!=null?{label:L.linePrv,data:[{x:0,y:prvY,r:14}],backgroundColor:'rgba(156,163,175,0.5)',borderColor:'rgba(156,163,175,0.8)',borderWidth:1.5}:{data:[]}
      ]},options:{...baseOpts,plugins:{...baseOpts.plugins,tooltip:mkTip({label:c=>' '+c.dataset.label+': '+fmt(c.raw.y)})}}});
    }else{
      ch=new Chart(canvas,{type:'line',data:{
        labels:pts.map((_,i)=>i),
        datasets:[
          {label:L.lineCur,data:pts.map(p=>p.y),borderColor:color,borderWidth:2,backgroundColor:grad,fill:true,tension:0,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:color,pointHoverBorderColor:'#fff',pointHoverBorderWidth:2},
          {label:L.linePrv,data:prv.map(p=>p.y),borderColor:'rgba(156,163,175,.6)',borderWidth:1.5,borderDash:[4,3],fill:false,tension:0,pointRadius:0,pointHoverRadius:4}
        ]
      },options:{...baseOpts,interaction:{mode:'index',intersect:false},plugins:{...baseOpts.plugins,tooltip:mkTip({
        title:items=>{const i=items[0]?items[0].dataIndex:0,cx=pts[i]?normDate(pts[i].x):'',px=prv[i]&&prv[i].x?normDate(prv[i].x):'';return px?[cx+' / '+px]:[cx];},
        label:c=>c.raw==null?null:' '+c.dataset.label+': '+fmt(c.raw)
      })}}});
    }

    if(firstLoad){G('app').style.opacity='1';firstLoad=false;}

  }catch(e){
    console.error('KPI v68 error:',e);
    G('val').textContent='Error';G('chg').textContent=e.message||'check console';G('chg').className='chg down';
    if(firstLoad){G('app').style.opacity='1';firstLoad=false;}
  }
  setFonts();
}

const debouncedLoad=()=>{clearTimeout(timer);timer=setTimeout(load,150);};

async function init(){
  if(typeof tableau==='undefined'){setTimeout(init,50);return;}
  await tableau.extensions.initializeAsync();
  ws=tableau.extensions.worksheetContent.worksheet;
  setFonts();load();
  ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,debouncedLoad);
  try{
    const params=await ws.getParametersAsync();
    params.forEach(p=>p.addEventListener(tableau.TableauEventType.ParameterChanged,debouncedLoad));
  }catch(e){console.warn('No param listener:',e);}
}
window.onload=init;
</script>
</body></html>
