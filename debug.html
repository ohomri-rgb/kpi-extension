<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ECharts Extension — Debug Panel</title>
<script src="tableau.extensions.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0d;
  --surface: #1a1a17;
  --surface2: #222220;
  --border: #2e2e2a;
  --text: #e8e6de;
  --text2: #8a8880;
  --text3: #555450;
  --green: #4ade80;
  --green-dim: #1a3d28;
  --amber: #fbbf24;
  --amber-dim: #3d2e0a;
  --red: #f87171;
  --red-dim: #3d1515;
  --blue: #60a5fa;
  --blue-dim: #0f2040;
  --teal: #2dd4bf;
  --purple: #a78bfa;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
}

/* ── LAYOUT ── */
.layout { display: flex; height: 100vh; flex-direction: column; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-title { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: 0.06em; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-dot.error { background: var(--red); }
.status-text { font-size: 11px; color: var(--text2); font-family: var(--mono); }

.topbar-actions { display: flex; gap: 8px; }
.btn {
  padding: 5px 12px; border-radius: 5px; font-size: 11px; font-weight: 500;
  font-family: var(--sans); cursor: pointer; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text2);
  transition: all 0.15s; letter-spacing: 0.04em;
}
.btn:hover { background: var(--border); color: var(--text); }
.btn.primary { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.btn.primary:hover { background: #223d2e; }

/* ── MAIN ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-section { border-bottom: 1px solid var(--border); }
.sidebar-label {
  font-size: 10px; font-weight: 500; color: var(--text3);
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 10px 14px 6px;
}
.sidebar-list { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-item {
  padding: 6px 10px; border-radius: 4px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  transition: all 0.1s; display: flex; align-items: center; gap: 8px;
}
.sidebar-item:hover { background: var(--surface2); color: var(--text); }
.sidebar-item.active { background: var(--blue-dim); color: var(--blue); }
.sidebar-item .item-icon { width: 12px; height: 12px; flex-shrink: 0; }

/* ── CONTENT ── */
.content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* ── SECTION CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.card-title { font-size: 11px; font-weight: 500; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; }
.card-badge {
  font-size: 10px; font-family: var(--mono);
  padding: 2px 7px; border-radius: 3px;
}
.badge-count { background: var(--surface); color: var(--text3); border: 1px solid var(--border); }

/* ── TABLE ── */
.debug-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
.debug-table th {
  text-align: right; padding: 6px 14px;
  color: var(--text3); font-weight: 500;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  white-space: nowrap;
}
.debug-table td {
  padding: 7px 14px; color: var(--text);
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.debug-table tr:last-child td { border-bottom: none; }
.debug-table tr:hover td { background: var(--surface2); }

.tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500; }
.tag-dim     { background: var(--blue-dim); color: var(--blue); }
.tag-measure { background: var(--green-dim); color: var(--green); }
.tag-date    { background: var(--amber-dim); color: var(--amber); }
.tag-string  { background: #1e1a2e; color: var(--purple); }
.tag-bool    { background: #1e2a1e; color: var(--teal); }
.tag-agg     { background: #2a1a1a; color: var(--red); font-size: 9px; }

/* ── RAW ROWS ── */
.rows-wrap { overflow-x: auto; }
.raw-row {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px;
}
.raw-row:last-child { border-bottom: none; }
.raw-row:hover { background: var(--surface2); }
.raw-idx { padding: 6px 10px; color: var(--text3); min-width: 40px; border-left: 1px solid var(--border); flex-shrink: 0; }
.raw-cell { padding: 6px 14px; color: var(--text); border-left: 1px solid var(--border); min-width: 120px; }
.raw-cell.null-val { color: var(--text3); font-style: italic; }
.raw-cell.num-val { color: var(--green); }
.raw-cell.date-val { color: var(--amber); }
.raw-header {
  display: flex; background: var(--surface2);
  border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px;
}
.raw-header-idx { padding: 6px 10px; color: var(--text3); min-width: 40px; border-left: 1px solid var(--border); flex-shrink: 0; }
.raw-header-cell { padding: 6px 14px; color: var(--text2); border-left: 1px solid var(--border); min-width: 120px; white-space: nowrap; }

/* ── JSON BLOCK ── */
.json-block {
  padding: 14px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text2); line-height: 1.8;
  white-space: pre-wrap; word-break: break-all;
}
.json-key { color: var(--blue); }
.json-str { color: var(--green); }
.json-num { color: var(--amber); }
.json-null { color: var(--text3); }

/* ── LOG ── */
.log-wrap { padding: 10px 14px; font-family: var(--mono); font-size: 11px; line-height: 2; max-height: 200px; overflow-y: auto; }
.log-line { display: flex; gap: 10px; align-items: baseline; }
.log-time { color: var(--text3); flex-shrink: 0; }
.log-level-info  { color: var(--blue); flex-shrink: 0; }
.log-level-ok    { color: var(--green); flex-shrink: 0; }
.log-level-warn  { color: var(--amber); flex-shrink: 0; }
.log-level-error { color: var(--red); flex-shrink: 0; }
.log-msg { color: var(--text); }

/* ── EMPTY ── */
.empty { padding: 32px; text-align: center; color: var(--text3); font-size: 12px; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="layout">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="status-dot" id="status-dot"></div>
      <span class="topbar-title">ECHARTS EXTENSION — DEBUG</span>
      <span class="status-text" id="status-text">מחבר...</span>
    </div>
    <div class="topbar-actions">
      <button class="btn" onclick="copyJSON()">העתק JSON</button>
      <button class="btn primary" id="btn-refresh" onclick="loadData()">↻ רענן</button>
    </div>
  </div>

  <div class="main">

    <!-- Content -->
    <div class="content" id="content">
      <div class="empty">ממתין לחיבור Tableau...</div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">ניווט</div>
        <div class="sidebar-list">
          <div class="sidebar-item active" onclick="scrollTo('section-columns')">
            <svg class="item-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="10" height="10" rx="1.5"/><line x1="1" y1="4" x2="11" y2="4"/><line x1="4" y1="4" x2="4" y2="11"/></svg>
            עמודות (columns)
          </div>
          <div class="sidebar-item" onclick="scrollTo('section-rows')">
            <svg class="item-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="3" x2="11" y2="3"/><line x1="1" y1="6" x2="11" y2="6"/><line x1="1" y1="9" x2="11" y2="9"/></svg>
            שורות (10 ראשונות)
          </div>
          <div class="sidebar-item" onclick="scrollTo('section-raw')">
            <svg class="item-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="10" height="10" rx="1.5"/><line x1="3" y1="4" x2="9" y2="4"/><line x1="3" y1="6" x2="9" y2="6"/><line x1="3" y1="8" x2="7" y2="8"/></svg>
            raw column object
          </div>
          <div class="sidebar-item" onclick="scrollTo('section-log')">
            <svg class="item-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="5"/><line x1="6" y1="4" x2="6" y2="7"/><circle cx="6" cy="8.5" r="0.5" fill="currentColor"/></svg>
            לוג
          </div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">גיליון</div>
        <div class="sidebar-list" id="ws-info">
          <div class="sidebar-item" style="color:var(--text3);font-size:11px;">טוען...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let rawData = null;
const logs = [];

function log(level, msg) {
  const now = new Date();
  const time = now.toTimeString().slice(0,8);
  logs.push({ time, level, msg });
  renderLog();
}

function ts() { return new Date().toTimeString().slice(0,8); }

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + state;
  txt.textContent = text;
}

// ── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  log('info', 'מאתחל tableau.extensions...');

  tableau.extensions.initializeAsync().then(() => {
    setStatus('connected', 'מחובר');
    log('ok', 'initializeAsync() הצליח');

    const ws = tableau.extensions.worksheetContent.worksheet;
    log('info', `גיליון: "${ws.name}"`);

    // Worksheet info in sidebar
    document.getElementById('ws-info').innerHTML = `
      <div class="sidebar-item" style="color:var(--teal);font-size:11px;cursor:default">${ws.name}</div>
    `;

    // Event listeners
    ws.addEventListener(tableau.TableauEventType.FilterChanged, () => {
      log('warn', 'FilterChanged — טוען מחדש');
      loadData();
    });
    ws.addEventListener(tableau.TableauEventType.MarkSelectionChanged, () => {
      log('info', 'MarkSelectionChanged — טוען מחדש');
      loadData();
    });

    loadData();

  }).catch(err => {
    setStatus('error', 'שגיאה');
    log('error', `initializeAsync נכשל: ${err}`);
    renderError(`initializeAsync נכשל:\n${err}`);
  });
});

// ── LOAD DATA ───────────────────────────────────────────
async function loadData() {
  try {
    const ws = tableau.extensions.worksheetContent.worksheet;
    log('info', 'קורא getSummaryDataAsync...');

    const dt = await ws.getSummaryDataAsync();
    rawData = dt;

    log('ok', `התקבלו ${dt.data.length} שורות, ${dt.columns.length} עמודות`);
    if (dt.isTotalRowCountLimited) {
      log('warn', `⚠ הנתונים חתוכים! מוצגות ${dt.data.length} שורות בלבד`);
    }

    renderAll(dt);

  } catch(err) {
    setStatus('error', 'שגיאת טעינה');
    log('error', `getSummaryDataAsync נכשל: ${err}`);
    renderError(`getSummaryDataAsync נכשל:\n${err}`);
  }
}

// ── RENDER ALL ──────────────────────────────────────────
function renderAll(dt) {
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(buildColumnsCard(dt));
  content.appendChild(buildRowsCard(dt));
  content.appendChild(buildRawCard(dt));
  content.appendChild(buildLogCard());
}

// ── COLUMNS CARD ────────────────────────────────────────
function buildColumnsCard(dt) {
  const card = mkCard('section-columns', 'עמודות — columns', `${dt.columns.length} עמודות`);
  const body = document.createElement('div');
  body.style.overflowX = 'auto';

  const table = document.createElement('table');
  table.className = 'debug-table';
  table.innerHTML = `<thead><tr>
    <th>#</th>
    <th>fieldName <span style="color:var(--text3);font-size:9px">(מה מגיע מה-API)</span></th>
    <th>dataType</th>
    <th>isReferenced</th>
    <th>aggregation</th>
    <th>role</th>
    <th>כל שאר המפתחות</th>
  </tr></thead>`;

  const tbody = document.createElement('tbody');
  dt.columns.forEach((col, i) => {
    const tr = document.createElement('tr');

    // dataType tag
    const dtTag = {
      'date': `<span class="tag tag-date">date</span>`,
      'date-time': `<span class="tag tag-date">date-time</span>`,
      'float': `<span class="tag tag-measure">float</span>`,
      'int': `<span class="tag tag-measure">int</span>`,
      'string': `<span class="tag tag-string">string</span>`,
      'boolean': `<span class="tag tag-bool">boolean</span>`,
    }[col.dataType] || `<span class="tag tag-string">${col.dataType}</span>`;

    // role tag
    const roleTag = col.isAttribute !== undefined
      ? (col.isAttribute ? `<span class="tag tag-dim">dimension</span>` : `<span class="tag tag-measure">measure</span>`)
      : '—';

    // aggregation
    const aggTag = col.aggregation
      ? `<span class="tag tag-agg">${col.aggregation}</span>`
      : '<span style="color:var(--text3)">—</span>';

    // extra keys — dump everything else
    const knownKeys = ['fieldName','dataType','isReferenced','aggregation','isAttribute','index'];
    const extra = Object.keys(col)
      .filter(k => !knownKeys.includes(k))
      .map(k => `<span style="color:var(--text3)">${k}:</span> <span style="color:var(--purple)">${JSON.stringify(col[k])}</span>`)
      .join('  ');

    tr.innerHTML = `
      <td style="color:var(--text3)">${i}</td>
      <td><span style="color:var(--amber)">"${col.fieldName}"</span></td>
      <td>${dtTag}</td>
      <td style="color:${col.isReferenced ? 'var(--green)' : 'var(--text3)'}">${col.isReferenced}</td>
      <td>${aggTag}</td>
      <td>${roleTag}</td>
      <td style="font-size:10px;color:var(--text2)">${extra || '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  body.appendChild(table);
  card.appendChild(body);
  return card;
}

// ── ROWS CARD ───────────────────────────────────────────
function buildRowsCard(dt) {
  const max = Math.min(dt.data.length, 10);
  const card = mkCard('section-rows', `שורות — ${max} מתוך ${dt.data.length}`, dt.isTotalRowCountLimited ? '⚠ חתוך' : 'מלא');

  const wrap = document.createElement('div');
  wrap.className = 'rows-wrap';

  // Header
  const header = document.createElement('div');
  header.className = 'raw-header';
  header.innerHTML = `<div class="raw-header-idx">#</div>` +
    dt.columns.map(c => `<div class="raw-header-cell">${c.fieldName}</div>`).join('');
  wrap.appendChild(header);

  // Rows
  for (let r = 0; r < max; r++) {
    const row = dt.data[r];
    const div = document.createElement('div');
    div.className = 'raw-row';
    div.innerHTML = `<div class="raw-idx">${r}</div>` +
      row.map((cell, ci) => {
        const col = dt.columns[ci];
        let cls = 'raw-cell';
        let val = cell.value;
        if (val === null || val === undefined || val === '%null%') {
          return `<div class="${cls} null-val">null</div>`;
        }
        if (col.dataType === 'float' || col.dataType === 'int') cls += ' num-val';
        else if (col.dataType === 'date' || col.dataType === 'date-time') cls += ' date-val';
        // Show both .value and .formattedValue if different
        const fv = cell.formattedValue !== undefined && cell.formattedValue !== String(val)
          ? ` <span style="color:var(--text3);font-size:10px">(${cell.formattedValue})</span>`
          : '';
        return `<div class="${cls}">${val}${fv}</div>`;
      }).join('');
    wrap.appendChild(div);
  }

  card.appendChild(wrap);
  return card;
}

// ── RAW COLUMN OBJECT ───────────────────────────────────
function buildRawCard(dt) {
  const card = mkCard('section-raw', 'raw column[0] — כל המפתחות שמגיעים', '');

  const pre = document.createElement('div');
  pre.className = 'json-block';

  if (dt.columns.length === 0) {
    pre.textContent = '// אין עמודות';
  } else {
    // dump column 0 + column 1 if exists
    const cols = dt.columns.slice(0, Math.min(3, dt.columns.length));
    const out = cols.map((col, i) => {
      const entries = Object.keys(col).map(k => {
        const v = col[k];
        const vs = typeof v === 'string' ? `"${v}"` : JSON.stringify(v);
        return `  <span class="json-key">"${k}"</span>: <span class="${typeof v === 'string' ? 'json-str' : typeof v === 'number' ? 'json-num' : 'json-null'}">${vs}</span>`;
      }).join(',\n');
      return `<span style="color:var(--text3)">// column[${i}]</span>\n{\n${entries}\n}`;
    }).join('\n\n');
    pre.innerHTML = out;
  }

  card.appendChild(pre);
  return card;
}

// ── LOG CARD ────────────────────────────────────────────
function buildLogCard() {
  const card = mkCard('section-log', 'לוג', `${logs.length} הודעות`);
  renderLog(card);
  return card;
}

function renderLog(card) {
  const existing = document.getElementById('section-log');
  const target = card || existing;
  if (!target) return;

  let logWrap = target.querySelector('.log-wrap');
  if (!logWrap) {
    logWrap = document.createElement('div');
    logWrap.className = 'log-wrap';
    target.appendChild(logWrap);
  }

  logWrap.innerHTML = logs.map(l => `
    <div class="log-line">
      <span class="log-time">${l.time}</span>
      <span class="log-level-${l.level}">${{info:'INFO',ok:'  OK',warn:'WARN',error:'ERR '}[l.level]}</span>
      <span class="log-msg">${l.msg}</span>
    </div>
  `).join('');
  logWrap.scrollTop = logWrap.scrollHeight;
}

// ── HELPERS ─────────────────────────────────────────────
function mkCard(id, title, badge) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = id;
  card.innerHTML = `
    <div class="card-header">
      <span class="card-title">${title}</span>
      ${badge ? `<span class="card-badge badge-count">${badge}</span>` : ''}
    </div>
  `;
  return card;
}

function scrollTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  try {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) {
    document.getElementById('content').scrollTop = el.offsetTop - 16;
  }
}

function copyJSON() {
  if (!rawData) return;
  const out = {
    columns: rawData.columns.map(c => ({ ...c })),
    sampleRows: rawData.data.slice(0, 5).map((row, ri) =>
      Object.fromEntries(rawData.columns.map((c, i) => [c.fieldName, row[i]?.value]))
    ),
    totalRows: rawData.data.length,
    isTotalRowCountLimited: rawData.isTotalRowCountLimited
  };
  const json = JSON.stringify(out, null, 2);
  console.log('%c[ECharts Debug] JSON Output:', 'color:#4ade80;font-weight:bold');
  console.log(json);
  log('ok', 'JSON מודפס בקונסול (F12 → Console)');
}

function renderError(msg) {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card">
      <div class="card-header"><span class="card-title" style="color:var(--red)">שגיאה</span></div>
      <div class="json-block" style="color:var(--red);white-space:pre">${msg}</div>
    </div>
  `;
  renderLog();
}
</script>

</body>
</html>
