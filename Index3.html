<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Superstore Filter POC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tableau/extensions-api-lib@1/dist/tableau.extensions.1.latest.js"></script>
    <script src="app2new.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f9f9f9; color: #333; }
        .section { margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
        h3 { margin: 0 0 8px 0; font-size: 16px; color: #111; }
        label { display: inline-block; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
        input[type="checkbox"] { margin-left: 6px; transform: scale(1.1); }
        button { 
            margin-top: 10px; padding: 10px 20px; 
            background-color: #1f77b4; color: white; 
            border: none; border-radius: 4px; 
            cursor: pointer; font-size: 14px; font-weight: bold; 
        }
        button:hover { background-color: #115588; }
    </style>
</head>
<body>

    <div class="section">
        <h3>Segment</h3>
        <label><input type="checkbox" class="segment-chk" value="Consumer"> Consumer</label><br>
        <label><input type="checkbox" class="segment-chk" value="Corporate"> Corporate</label><br>
        <label><input type="checkbox" class="segment-chk" value="Home Office"> Home Office</label>
    </div>

    <div class="section">
        <h3>Category</h3>
        <label><input type="checkbox" class="category-chk" value="Furniture"> Furniture</label><br>
        <label><input type="checkbox" class="category-chk" value="Office Supplies"> Office Supplies</label><br>
        <label><input type="checkbox" class="category-chk" value="Technology"> Technology</label>
    </div>

    <button id="applyBtn">Apply All</button>

</body>
</html>
